<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDLE - by mtahatavaci</title>
    <meta name="description" content="Neon Wordle — guess the 5-letter word in 6 tries.">
    <meta name="theme-color" content="#0a0e27">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%2300ff41%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2765%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-weight=%27bold%27%3EW%3C/text%3E%3C/svg%3E">
    <link rel="preload" as="image" href="img/char-left.webp">
    <link rel="preload" as="image" href="img/char-right.webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0e3f 50%, #0f1a3f 100%);
            color: #e0e0ff;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
            padding: clamp(8px, 2vw, 20px) 0;
            padding-top: max(clamp(8px, 2vw, 20px), env(safe-area-inset-top));
            padding-bottom: max(clamp(8px, 2vw, 20px), env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: clamp(12px, 3vw, 24px);
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: clamp(16px, 4vw, 30px);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.9rem, 8vw, 3.5rem);
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            letter-spacing: 3px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: #a0a0ff;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(6px, 1.5vw, 12px);
            justify-content: center;
            margin-bottom: clamp(14px, 3vw, 20px);
        }

        button {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.72rem, 2vw, 0.9rem);
            padding: clamp(7px, 1.8vw, 10px) clamp(12px, 3vw, 20px);
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-stats {
            background: rgba(0, 255, 255, 0.1);
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .btn-stats:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-new {
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .btn-new:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.6);
            transform: translateY(-2px);
        }

        .message {
            text-align: center;
            min-height: 24px;
            margin-bottom: 16px;
            font-size: clamp(0.8rem, 2.4vw, 0.95rem);
            color: #00ffff;
            animation: pulse 2s ease-in-out infinite;
            letter-spacing: 1px;
            padding: 0 10px;
            word-break: break-word;
        }

        .message.success { color: #00ff00; }
        .message.error { color: #ff0055; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer {
            text-align: center;
            font-size: clamp(1.3rem, 5vw, 2rem);
            font-family: 'Orbitron', sans-serif;
            color: #ff00ff;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            font-weight: 700;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(4px, 1.2vw, 8px);
            margin-bottom: clamp(16px, 3vw, 24px);
            padding: clamp(10px, 2.4vw, 20px);
            background: rgba(10, 14, 39, 0.4);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .tile {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.1rem, 5vw, 2rem);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            background: rgba(30, 20, 60, 0.6);
            color: #e0e0ff;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .tile.filled {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(40, 30, 80, 0.8);
        }

        .tile.present {
            background: linear-gradient(135deg, #ff3b3b 0%, #cc0000 100%);
            border-color: #ff3b3b;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 59, 59, 0.6), inset 0 0 10px rgba(255, 59, 59, 0.3);
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .tile.correct {
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            border-color: #00ff41;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6), inset 0 0 10px rgba(0, 255, 65, 0.3);
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .tile.absent {
            background: linear-gradient(135deg, #666 0%, #444 100%);
            border-color: #555;
            color: #ccc;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .input-section { margin-bottom: 16px; }

        .input-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: clamp(0.72rem, 2vw, 0.9rem);
            color: #a0a0ff;
            letter-spacing: 1px;
        }

        .input-boxes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(4px, 1vw, 6px);
            padding: clamp(8px, 2vw, 12px);
            background: rgba(10, 14, 39, 0.4);
            border: 2px solid rgba(255, 0, 255, 0.2);
            border-radius: 8px;
        }

        .input-tile {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 4.5vw, 1.8rem);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border: 2px solid rgba(255, 0, 255, 0.3);
            border-radius: 6px;
            background: rgba(40, 10, 60, 0.6);
            color: #ff00ff;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .input-tile.active {
            border-color: #ff00ff;
            background: rgba(60, 20, 80, 0.8);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .info-text {
            text-align: center;
            font-size: clamp(0.65rem, 1.8vw, 0.8rem);
            color: #888;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        /* Stats Overlay */
        .stats-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .stats-card {
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.95) 0%, rgba(10, 20, 50, 0.95) 100%);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: clamp(20px, 5vw, 32px);
            width: min(400px, calc(100vw - 24px));
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
        }

        .stats-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00ffff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .stats-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            margin: 16px 0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
        }

        .stat-label { color: #a0a0ff; font-size: 0.95rem; letter-spacing: 1px; }
        .stat-value { font-family: 'Orbitron', sans-serif; color: #00ff00; font-size: 1.4rem; font-weight: bold; }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .stats-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(0, 255, 255, 0.2);
        }

        .stats-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #a0a0ff;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .stats-tab.active { color: #00ffff; border-bottom-color: #00ffff; }

        .stats-content { display: none; max-height: 300px; overflow-y: auto; }
        .stats-content.active { display: flex;
            justify-content: center;
            align-items: center; }

        .history-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 255, 255, 0.05);
            border-left: 3px solid #00ffff;
            border-radius: 4px;
            font-size: 0.85rem;
            align-items: center;
        }

        .history-item.won { border-left-color: #00ff41; }
        .history-item.lost { border-left-color: #ff0055; background: rgba(255, 0, 85, 0.05); }
        .history-word { font-family: 'Orbitron', sans-serif; font-weight: bold; color: #00ffff; letter-spacing: 2px; }
        .history-status.won { color: #00ff41; font-weight: bold; }
        .history-status.lost { color: #ff0055; font-weight: bold; }
        .history-empty { text-align: center; color: #888; padding: 20px; }

        /* Game Result Modal */
        .game-result-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.98) 0%, rgba(20, 10, 50, 0.98) 100%);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: clamp(24px, 5vw, 40px) clamp(18px, 5vw, 50px);
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
            text-align: center;
            width: min(500px, calc(100vw - 24px));
            max-width: 500px;
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
        }

        .game-result-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .game-result-modal.victory {
            border-color: #00ff41;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.3);
        }

        .game-result-modal.defeat {
            border-color: #ff0055;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.3);
        }

        .result-icon { font-size: 4rem; margin-bottom: 20px; }

        .result-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        .result-title.victory { color: #00ff41; text-shadow: 0 0 20px rgba(0, 255, 65, 0.6); }
        .result-title.defeat { color: #ff0055; text-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }

        .result-stats {
            margin: 25px 0;
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .result-stat { display: flex; flex-direction: column; align-items: center; gap: 8px; }

        .result-stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: bold;
            color: #00ffff;
        }

        .result-stat-label { font-size: 0.85rem; color: #a0a0ff; letter-spacing: 1px; }

        .result-word {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            margin: 20px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 3px;
        }

        .result-word.defeat {
            background: rgba(255, 0, 85, 0.1);
            border-color: rgba(255, 0, 85, 0.3);
            color: #ff0055;
        }

        .result-message { color: #a0a0ff; font-size: 0.95rem; margin-top: 15px; letter-spacing: 1px; }

        /* DÜZELTME: Modal'da Yeni Oyun ve Analiz butonları */
        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .result-btn {
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 2px solid;
        }

        .result-btn-analysis-win {
            background: rgba(0, 255, 65, 0.1);
            border-color: #00ff41;
            color: #00ff41;
        }

        .result-btn-analysis-win:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }

        .result-btn-analysis-lose {
            background: rgba(255, 0, 85, 0.1);
            border-color: #ff0055;
            color: #ff0055;
        }

        .result-btn-analysis-lose:hover {
            background: rgba(255, 0, 85, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .result-btn-new {
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .result-btn-new:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        /* Guess Details Modal */
        .guess-details-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .guess-details-card {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.98) 0%, rgba(20, 10, 50, 0.98) 100%);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: clamp(20px, 5vw, 40px);
            width: min(600px, calc(100vw - 24px));
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3);
        }

        .guess-details-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00ffff;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .guess-entry {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .guess-number { font-family: 'Orbitron', sans-serif; color: #00ffff; font-size: 0.9rem; margin-bottom: 10px; }

        .guess-tiles { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }

        .guess-tile {
            width: 45px; height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            border: 2px solid;
        }

        .guess-tile.correct { background: linear-gradient(135deg, #00ff41, #00cc33); border-color: #00ff41; color: #000; }
        .guess-tile.present { background: linear-gradient(135deg, #ff3b3b, #cc0000); border-color: #ff3b3b; color: #fff; }
        .guess-tile.absent { background: linear-gradient(135deg, #666, #444); border-color: #555; color: #ccc; }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 1vw, 6px);
            margin-top: clamp(12px, 3vw, 18px);
            align-items: center;
            width: 100%;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }
        .keyboard-row {
            display: flex;
            gap: clamp(3px, 0.9vw, 5px);
            justify-content: center;
            width: 100%;
        }
        .key {
            flex: 1 1 0;
            min-width: 0;
            height: clamp(40px, 10vw, 54px);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.7rem, 2.6vw, 0.95rem);
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.35);
            color: #e0ffff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            user-select: none;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .key:hover:not(:disabled) { background: rgba(0, 255, 255, 0.2); transform: translateY(-1px); }
        .key:active:not(:disabled) { transform: translateY(1px); }
        .key:disabled { opacity: 0.4; cursor: not-allowed; }
        .key.wide { flex: 1.6 1 0; font-size: clamp(0.55rem, 1.9vw, 0.75rem); letter-spacing: 1px; }
        .key.correct { background: linear-gradient(135deg, #00ff41, #00cc33); border-color: #00ff41; color: #000; }
        .key.absent  { background: linear-gradient(135deg, #3a3a3a, #222); border-color: #444; color: #888; }

        .guess-analysis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }

        .analysis-item {
            background: rgba(0, 255, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid;
            text-align: center;
            font-size: 0.85rem;
        }

        .analysis-item.found { border-color: #00ff41; color: #00ff41; }
        .analysis-item.wrong-pos { border-color: #ffaa00; color: #ffaa00; }
        .analysis-item.not-found { border-color: #888; color: #888; }
        .analysis-label { font-size: 0.65rem; opacity: 0.7; }

        .close-details-btn {
            width: 100%;
            margin-top: 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .hidden { display: none !important; }

/* ══════════════════════════════════════════
   TITLE ROW — characters flanking the title
   ══════════════════════════════════════════ */
.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
    animation: slideDown 0.8s ease-out;
}

.title-row {
    display: flex;
    flex-direction: row;
    align-items: center;        /* vertically center everything */
    justify-content: center;
    width: 100%;
    gap: 12px;
}

.char-slot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.char-slot img {
    /* height matches the title text block — scales smoothly on all screens */
    height: clamp(48px, 13vw, 140px);
    width: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: none;
    display: block;
}

#char-left  { filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.5)); }
#char-right { filter: drop-shadow(0 0 8px rgba(255, 0, 255, 0.5)); }

.title-center {
    flex: 0 0 auto;
    text-align: center;
}

/* ── title-row gap shrinks on smaller screens (char-slot height is already fluid) ── */
@media (max-width: 768px) { .title-row { gap: 8px; } }
@media (max-width: 480px) { .title-row { gap: 6px; } }
@media (max-width: 360px) { .title-row { gap: 4px; } }

/* Keyboard sizing is handled by clamp() on .key / .keyboard */

/* ── Landscape mobile / short viewport ── */
@media (max-height: 560px) {
    .header { margin-bottom: 8px; }
    .title-row { gap: 6px; }
    .char-slot img { height: clamp(40px, 6vh, 70px); }
    .controls { margin-bottom: 8px; }
    .timer { margin-bottom: 8px; font-size: 1.2rem; }
    .game-board { margin-bottom: 10px; padding: 8px; }
    .keyboard { margin-top: 8px; }
    .key { height: clamp(32px, 6.5vh, 44px); }
}

/* ══════════ v3: layout — board takes the height that is left ══════════ */
body { padding: 0; }
.container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(8px, env(safe-area-inset-top)) clamp(8px, 3vw, 24px) max(8px, env(safe-area-inset-bottom));
}

.char-slot img { height: clamp(36px, min(13vw, 9dvh), 140px); aspect-ratio: 2 / 3; }
.title { font-size: clamp(1.6rem, min(8vw, 6dvh), 3.5rem); margin-bottom: 0; }
.subtitle { margin-top: 0; }
.controls { margin-bottom: clamp(4px, 1.4dvh, 20px); flex: none; }
.btn-icon { min-width: 44px; padding-left: 12px; padding-right: 12px; }
.message { min-height: 1.4em; margin-bottom: clamp(2px, 0.8dvh, 16px); flex: none; }
.timer { margin-bottom: clamp(2px, 0.8dvh, 16px); font-size: clamp(1.1rem, min(5vw, 3.6dvh), 2rem); flex: none; }
.board-wrap {
    flex: 1 1 0;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
}
.game-board {
    width: min(100%, 44dvh);
    width: min(100cqw, 80cqh);
    margin: 0;
    padding: clamp(5px, 1.6cqh, 16px);
    gap: clamp(4px, 1.1cqh, 8px);
}
.tile { font-size: clamp(1rem, min(7cqw, 5.4cqh), 2.1rem); }
.keyboard { margin-top: clamp(4px, 1.4dvh, 18px); flex: none; }
.key { height: clamp(36px, 6.4dvh, 58px); }

/* ══════════ keyboard / result / close ══════════ */
.key.present { background: linear-gradient(135deg, #ff3b3b, #cc0000); border-color: #ff3b3b; color: #fff; }
.result-close {
    position: absolute; top: 10px; right: 12px;
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #e0e0ff;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; line-height: 1;
}
.result-close:hover { border-color: #00ffff; color: #00ffff; }
.result-btn-share { background: linear-gradient(90deg, #00ff41, #00cc33); border-color: #00ff41; color: #000; }
.result-btn-share:hover { box-shadow: 0 0 20px rgba(0, 255, 65, 0.6); }

/* ══════════ animations ══════════ */
.game-board .tile.filled { border-color: rgba(224, 224, 255, 0.55); }
.game-board .tile.pop { animation: typePop 0.1s ease-in-out; }
.game-board .tile.reveal { animation: flipIn 0.5s ease-in-out both; }
.game-board .tile.win { animation: bounceUp 0.6s ease both; }
.game-board .tile.shake { animation: rowShake 0.5s ease-in-out; }
@keyframes typePop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes flipIn { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }
@keyframes bounceUp {
    0%, 20% { transform: translateY(0); }
    40% { transform: translateY(-30%); }
    50% { transform: translateY(5%); }
    60% { transform: translateY(-15%); }
    80% { transform: translateY(2%); }
    100% { transform: translateY(0); }
}
@keyframes rowShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
}

/* ══════════ toasts ══════════ */
.toast-container {
    position: fixed; top: 12%; left: 50%; transform: translateX(-50%);

.toast.fade { opacity: 0; }

/* ══════════ guess distribution ══════════ */
.dist-title { font-family: 'Orbitron', sans-serif; color: #a0a0ff; font-size: 0.85rem; letter-spacing: 2px; text-align: center; margin-bottom: 10px; }
.guess-dist { display: flex; flex-direction: column; gap: 5px; }

.dist-n { width: 12px; color: #e0e0ff; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; }
.dist-track { flex: 1; }
.dist-bar {

.dist-bar.hl { background: linear-gradient(90deg, #00cc33, #00ff41); color: #000; }

/* ══════════ settings ══════════ */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; cursor: pointer; }
.setting-name { display: block; color: #e0e0ff; font-weight: 700; letter-spacing: 1px; }
.setting-desc { display: block; color: #8888bb; font-size: 0.78rem; margin-top: 4px; }
.switch {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 46px; height: 26px; border-radius: 13px; position: relative; cursor: pointer;
    background: #3a3a5a; border: 1px solid rgba(0, 255, 255, 0.35); transition: background 0.2s ease;
}
.switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: #e0e0ff; transition: transform 0.2s ease;
}
.switch:checked { background: #00cc33; }
.switch:checked::after { transform: translateX(20px); }

/* ══════════ accessibility ══════════ */
.sr-only {

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

body { background-color: #0a0e27; }

nebzineszingszingyzinkezinkyzinoszippozippyziramzitiszittyzizelzizitzlotezlotyzoaeazoboszobuszoccozoeaezoealzoeaszoismzoistzokorzollezombizonaezonalzondazonedzonerzoneszonkszooeazooeyzooidzookszoomszoomyzoonszootyzoppazoppozorilzoriszorrozorsezoukszoweezowiezuluszupanzupaszuppazurfszuzimzygalzygonzymeszymic'.toUpperCase().match(/.{5}/g));
        ANSWERS.forEach(w => ALLOWED.add(w));

        const REDUCED_MOTION = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
        const FLIP_STEP = REDUCED_MOTION ? 0 : 300;   // delay between tiles
        const FLIP_DUR = REDUCED_MOTION ? 0 : 500;    // one tile flip
        const WIN_WORDS = ['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Phew'];
        const STATE_LABEL = { correct: 'correct', present: 'in the word, wrong spot', absent: 'not in the word' };
        const SHARE_EMOJI = { correct: '🟩', present: '🟥', absent: '⬛' };

        let state = null;
        let stats = null;
        let settings = null;
        let currentInput = '';
        let timerInterval = null;
        let inputEnabled = false;
        let timerStarted = false;
        let revealing = false;

        // ── Storage helpers ─────────────────────────────
        // localStorage can throw on access (iOS with cookies blocked, some private modes,
        // sandboxed webviews). Fall back to memory so the game still works for this visit.
        const memStore = {};
        const store = {
            get(k) { try { return window.localStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } },
            set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { memStore[k] = String(v); } },
            remove(k) { try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } delete memStore[k]; }
        };
        function readJSON(key, fallback) {
            try {
                const v = JSON.parse(store.get(key));
                return v ?? fallback;
            } catch (e) {
                store.remove(key);
                return fallback;
            }
        }
        function writeJSON(key, value) { store.set(key, JSON.stringify(value)); }
        const encodeWord = w => btoa(w.split('').reverse().join(''));
        const decodeWord = s => { try { return atob(s).split('').reverse().join(''); } catch (e) { return null; } };

        function getInitialState() {
            return { secret_word: null, guesses: [], current_row: 0, game_over: false, won: false, elapsed: 0 };
        }
        function getInitialStats() {
            return { games_played: 0, wins: 0, current_streak: 0, max_streak: 0, total_win_time: 0, win_count: 0, last_solve_time: 0, guess_dist: [0, 0, 0, 0, 0, 0], last_result: 0 };
        }

        function loadState() {
            const s = readJSON(STATE_KEY, null);
            if (!s || typeof s !== 'object') return null;
            // migrate old plaintext format
            const word = s.w ? decodeWord(s.w) : s.secret_word;
            if (!word || !/^[A-Z]{5}$/.test(word) || !ALLOWED.has(word)) return null;
            const guesses = Array.isArray(s.guesses) ? s.guesses.filter(g => /^[A-Z]{5}$/.test(g)).slice(0, MAX_ATTEMPTS) : [];
            return {
                secret_word: word,
                guesses,
                current_row: guesses.length,
                game_over: !!s.game_over,
                won: !!s.won,
                elapsed: Number.isFinite(s.elapsed) ? s.elapsed : 0
            };
        }
        function saveState() {
            if (!state.secret_word) return;
            const { secret_word, ...rest } = state;
            writeJSON(STATE_KEY, { ...rest, w: encodeWord(secret_word) });
        }
        function deleteState() { store.remove(STATE_KEY); }

        function loadStats() {
            const saved = readJSON(STATS_KEY, {});
            stats = { ...getInitialStats(), ...(saved && typeof saved === 'object' ? saved : {}) };
            // older saves have no distribution: rebuild it from history
            if (!Array.isArray(saved && saved.guess_dist) || saved.guess_dist.length !== MAX_ATTEMPTS) {
                stats.guess_dist = [0, 0, 0, 0, 0, 0];
                getGameHistory().forEach(g => {
                    const n = Number(g.guesses);
                    if (g.won && n >= 1 && n <= MAX_ATTEMPTS) stats.guess_dist[n - 1]++;
                });
                saveStats();
            }
        }
        function saveStats() { writeJSON(STATS_KEY, stats); }
        function getGameHistory() { const h = readJSON(HISTORY_KEY, []); return Array.isArray(h) ? h : []; }
        function saveGameHistory(history) { writeJSON(HISTORY_KEY, history); }

        function loadSettings() { settings = { keyboardOnly: false, ...readJSON(SETTINGS_KEY, {}) }; }
        function saveSettings() { writeJSON(SETTINGS_KEY, settings); }

        function addGameToHistory(won, word, guesses, time) {
            const history = getGameHistory();
            const today = new Date().toISOString().split('T')[0];
            history.unshift({
                date: today,
                word,
                guesses: guesses.length,
                time,
                won,
                guessDetails: guesses.map(g => ({ word: g, scores: scoreGuess(g, word) }))
            });
            if (history.length > 100) history.length = 100;
            saveGameHistory(history);
        }

        // ── Init ────────────────────────────────────────
        function safeRun(name, fn) {
            try { fn(); } catch (e) { console.error(name + ' failed:', e); }
        }
        window.addEventListener('DOMContentLoaded', () => {
            safeRun('keyboard', renderKeyboard);            // first: never depends on storage
            safeRun('settings', loadSettings);
            if (!settings) settings = { keyboardOnly: false };
            safeRun('stats', loadStats);
            if (!stats) stats = getInitialStats();
            safeRun('game', initializeGame);
            safeRun('events', setupEventListeners);
        });

        function initializeGame() {
            const saved = loadState();
            if (saved && !saved.game_over) {
                state = saved;
                renderBoard();
                continueGame();
            } else {
                startNewGame();
            }
        }

        function pickSecretWord() {
            const recent = new Set(getGameHistory().slice(0, 200).map(g => g.word));
            const pool = ANSWERS.filter(w => !recent.has(w));
            const list = pool.length ? pool : ANSWERS;
            return list[Math.floor(Math.random() * list.length)];
        }

        function startNewGame() {
            deleteState();
            state = getInitialState();
            state.secret_word = pickSecretWord();
            saveState();
            stopTimer();
            timerStarted = false;
            inputEnabled = false;
            revealing = false;
            currentInput = '';
            updateTimerDisplay();
            closeGameResultModal();
            renderBoard();
            updateStartButtonState();
            showMessage('Ready! Click START to begin.', 'info', true);
        }

        function continueGame() {
            inputEnabled = false;
            timerStarted = false;
            setInput('');
            updateTimerDisplay();
            updateStartButtonState('▶ RESUME');
            showMessage('Game paused. Click RESUME to continue.', 'info', true);
        }

        // ── Keyboard ────────────────────────────────────
        const KEYBOARD_ROWS = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['ENTER','Z','X','C','V','B','N','M','BACKSPACE']
        ];

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            KEYBOARD_ROWS.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'keyboard-row';
                row.forEach(k => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'key' + (k.length > 1 ? ' wide' : '');
                    btn.dataset.key = k;
                    btn.textContent = k === 'BACKSPACE' ? '⌫' : k;
                    btn.setAttribute('aria-label', k === 'BACKSPACE' ? 'Backspace' : k === 'ENTER' ? 'Enter' : k);
                    btn.addEventListener('click', () => { handleKey(k); btn.blur(); });
                    rowEl.appendChild(btn);
                });
                kb.appendChild(rowEl);
            });
        }

        function canType() {
            return inputEnabled && timerStarted && !revealing && state && !state.game_over && !isOverlayOpen();
        }

        function isOverlayOpen() {
            return !!document.querySelector('.stats-overlay:not(.hidden), .guess-details-overlay:not(.hidden), .game-result-modal.show');
        }

        function handleKey(key) {
            if (!canType()) return;
            if (key === 'ENTER') { submitGuess(); return; }
            if (key === 'BACKSPACE') { setInput(currentInput.slice(0, -1)); return; }
            if (/^[A-Z]$/.test(key) && currentInput.length < WORD_LENGTH) setInput(currentInput + key);
        }

        function setInput(v) {
            const grew = v.length > currentInput.length;
            currentInput = v;
            updateCurrentRow(grew);
        }

        function updateKeyboardState() {
            const rank = { absent: 1, present: 2, correct: 3 };
            const best = {};
            if (state.secret_word) {
                state.guesses.forEach(g => {
                    scoreGuess(g, state.secret_word).forEach((s, i) => {
                        if ((rank[s] || 0) > (rank[best[g[i]]] || 0)) best[g[i]] = s;
                    });
                });
            }
            document.querySelectorAll('.key').forEach(btn => {
                const k = btn.dataset.key;
                btn.classList.remove('correct', 'present', 'absent');
                const s = best[k];
                if (s) btn.classList.add(s);
                if (k.length === 1) btn.setAttribute('aria-label', s ? `${k}, ${STATE_LABEL[s]}` : k);
            });
        }

        // ── Game logic ──────────────────────────────────
        function scoreGuess(guess, secret) {
            guess = guess.toUpperCase();
            secret = secret.toUpperCase();
            const scores = Array(WORD_LENGTH).fill('absent');
            const secretList = secret.split('');
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guess[i] === secret[i]) { scores[i] = 'correct'; secretList[i] = null; }
            }
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (scores[i] === 'absent') {
                    const idx = secretList.indexOf(guess[i]);
                    if (idx !== -1) { scores[i] = 'present'; secretList[idx] = null; }
                }
            }
            return scores;
        }

        function isValidWord(word) { return ALLOWED.has(word); }

        function submitGuess() {
            if (revealing) return;
            const guess = currentInput.toUpperCase();
            if (guess.length !== WORD_LENGTH) { shakeRow(); showToast('Not enough letters'); return; }
            if (!isValidWord(guess)) { shakeRow(); showToast('Not in word list'); return; }
            if (state.guesses.includes(guess)) { shakeRow(); showToast('Already guessed'); return; }

            const row = state.guesses.length;
            state.guesses.push(guess);
            state.current_row = state.guesses.length;
            currentInput = '';
            const won = guess === state.secret_word;
            const finished = won || state.current_row >= MAX_ATTEMPTS;
            if (finished) endGame(won);   // stats + timer settle immediately, visuals follow the reveal
            else saveState();

            revealing = true;
            revealRow(row, guess, () => {
                revealing = false;
                updateKeyboardState();
                announceGuess(guess);
                if (finished) {
                    if (won) {
                        bounceRow(row);
                        showToast(WIN_WORDS[row] || 'Phew', 1800);
                    } else {
                        showToast(state.secret_word, 2500);
                    }
                    setTimeout(() => showGameResultModal(won, state.guesses.length, state.elapsed, state.secret_word), REDUCED_MOTION ? 300 : 1800);
                } else {
                    updateCurrentRow();
                    const remaining = MAX_ATTEMPTS - state.current_row;
                    showMessage(`${remaining} guess${remaining !== 1 ? 'es' : ''} left`, 'info');
                }
            });
        }

        function endGame(won) {
            stopTimer();
            state.game_over = true;
            state.won = won;
            saveState();
            updateStats(won, state.elapsed, state.guesses);
            inputEnabled = false;
            timerStarted = false;
            updateStartButtonState();
            showMessage(won ? '✦ VICTORY' : '◆ DEFEAT', won ? 'success' : 'error', true);
        }

        function updateStats(won, solveTime, guesses) {
            stats.games_played++;
            if (won) {
                stats.wins++;
                stats.total_win_time += solveTime;
                stats.win_count++;
                stats.last_solve_time = solveTime;
                stats.current_streak++;
                if (stats.current_streak > stats.max_streak) stats.max_streak = stats.current_streak;
                stats.guess_dist[guesses.length - 1]++;
                stats.last_result = guesses.length;
            } else {
                stats.current_streak = 0;
                stats.last_result = 0;
            }
            saveStats();
            addGameToHistory(won, state.secret_word, guesses, solveTime);
        }

        // ── Timer / controls ────────────────────────────
        function startGameTimer() {
            if (!state.secret_word || timerStarted || state.game_over) return;
            timerStarted = true;
            inputEnabled = true;
            startTimer();
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            showMessage('Game started! Make your guess.', 'success');
            updateStartButtonState();
        }

        function pauseGameTimer() {
            timerStarted = false;
            inputEnabled = false;
            stopTimer();
            saveState();
            showMessage('Paused. Click RESUME to continue.', 'info', true);
            updateStartButtonState('▶ RESUME');
        }

        function resetGame() { startNewGame(); }

        function updateStartButtonState(idleLabel = '▶ START') {
            const startBtn = document.getElementById('startBtn');
            if (state.game_over) {
                startBtn.textContent = '🔄 NEW';
                startBtn.onclick = resetGame;
            } else if (timerStarted) {
                startBtn.textContent = '⏸ PAUSE';
                startBtn.onclick = pauseGameTimer;
            } else {
                startBtn.textContent = idleLabel;
                startBtn.onclick = startGameTimer;
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            document.getElementById('timer').textContent = formatTime(state ? state.elapsed : 0);
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                state.elapsed++;
                updateTimerDisplay();
                saveState();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        // ── Board rendering ─────────────────────────────
        function tileAt(row, col) { return document.getElementById('gameBoard').children[row * WORD_LENGTH + col]; }

        function setTileLabel(tile, row, col, letter, score) {
            const what = letter ? (score ? `${letter}, ${STATE_LABEL[score]}` : letter) : 'empty';
            tile.setAttribute('aria-label', `Row ${row + 1}, letter ${col + 1}: ${what}`);
        }

        function renderBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            for (let row = 0; row < MAX_ATTEMPTS; row++) {
                const guess = state.guesses[row];
                const scores = guess ? scoreGuess(guess, state.secret_word) : null;
                for (let col = 0; col < WORD_LENGTH; col++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.setAttribute('role', 'img');
                    if (guess) {
                        tile.textContent = guess[col];
                        tile.classList.add(scores[col]);
                    }
                    setTileLabel(tile, row, col, guess && guess[col], scores && scores[col]);
                    gameBoard.appendChild(tile);
                }
            }
            updateCurrentRow();
            updateKeyboardState();
        }

        // the row being typed lives on the board itself (no separate input box)
        function updateCurrentRow(popLast) {
            const row = state.guesses.length;
            if (!state || state.game_over || revealing || row >= MAX_ATTEMPTS) return;
            if (document.getElementById('gameBoard').children.length !== MAX_ATTEMPTS * WORD_LENGTH) return;
            for (let col = 0; col < WORD_LENGTH; col++) {
                const tile = tileAt(row, col);
                const letter = currentInput[col] || '';
                tile.textContent = letter;
                tile.classList.toggle('filled', !!letter);
                tile.classList.remove('pop');
                setTileLabel(tile, row, col, letter, null);
            }
            if (popLast && currentInput.length && !REDUCED_MOTION) {
                const t = tileAt(row, currentInput.length - 1);
                void t.offsetWidth;
                t.classList.add('pop');
            }
        }

        function revealRow(row, guess, done) {
            const scores = scoreGuess(guess, state.secret_word);
            for (let col = 0; col < WORD_LENGTH; col++) {
                const tile = tileAt(row, col);
                tile.textContent = guess[col];
                tile.classList.remove('pop');
                tile.classList.add('filled');
                const apply = () => {
                    tile.classList.remove('filled');
                    tile.classList.add(scores[col]);
                    setTileLabel(tile, row, col, guess[col], scores[col]);
                };
                if (REDUCED_MOTION) { apply(); continue; }
                tile.style.animationDelay = `${col * FLIP_STEP}ms`;
                tile.classList.add('reveal');
                setTimeout(apply, col * FLIP_STEP + FLIP_DUR / 2);
            }
            setTimeout(done, (WORD_LENGTH - 1) * FLIP_STEP + FLIP_DUR);
        }

        function bounceRow(row) {
            if (REDUCED_MOTION) return;
            for (let col = 0; col < WORD_LENGTH; col++) {
                const tile = tileAt(row, col);
                tile.classList.remove('reveal');
                tile.style.animationDelay = `${col * 100}ms`;
                void tile.offsetWidth;
                tile.classList.add('win');
            }
        }

        function shakeRow() {
            const row = state.guesses.length;
            if (row >= MAX_ATTEMPTS || REDUCED_MOTION) return;
            for (let col = 0; col < WORD_LENGTH; col++) {
                const tile = tileAt(row, col);
                tile.classList.remove('shake');
                void tile.offsetWidth;
                tile.classList.add('shake');
                setTimeout(() => tile.classList.remove('shake'), 600);
            }
        }

        // ── Messages / toasts / screen reader ───────────
        let messageTimer = null;
        function showMessage(msg, type = 'info', persist = false) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.classList.remove('success', 'error');
            if (type === 'success' || type === 'error') el.classList.add(type);
            clearTimeout(messageTimer);
            if (!persist) messageTimer = setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
        }

        function showToast(msg, ms = 1300) {
            const box = document.getElementById('toasts');
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            box.prepend(t);
            setTimeout(() => { t.classList.add('fade'); setTimeout(() => t.remove(), 300); }, ms);
        }

        function announce(text) {
            const el = document.getElementById('srLive');
            el.textContent = '';
            setTimeout(() => { el.textContent = text; }, 50);
        }

        function announceGuess(guess) {
            const scores = scoreGuess(guess, state.secret_word);
            const parts = guess.split('').map((l, i) => `${l} ${STATE_LABEL[scores[i]]}`);
            const remaining = MAX_ATTEMPTS - state.guesses.length;
            announce(`${guess}: ${parts.join(', ')}. ${state.game_over ? '' : remaining + ' guesses left.'}`);
        }

        // ── Share ───────────────────────────────────────
        function buildShareText() {
            const score = state.won ? state.guesses.length : 'X';
            const grid = state.guesses.map(g => scoreGuess(g, state.secret_word).map(s => SHARE_EMOJI[s]).join('')).join('\n');
            const url = /^https?:/.test(location.origin) ? `\n\n${location.origin}` : '';
            return `WORDDLE ${score}/${MAX_ATTEMPTS} ⏱ ${formatTime(state.elapsed)}\n\n${grid}${url}`;
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
                ta.remove();
                return ok;
            }
        }

        async function shareResult() {
            if (!state || !state.game_over) return;
            const text = buildShareText();
            const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
            if (navigator.share && touch) {
                try { await navigator.share({ text }); return; }
                catch (e) { if (e && e.name === 'AbortError') return; }
            }
            showToast(await copyText(text) ? 'Copied results to clipboard' : 'Could not copy results');
        }

        // ── Modals ──────────────────────────────────────
        function focusFirst(container) {
            setTimeout(() => {
                const el = container.querySelector('button:not([disabled]), input');
                if (el) el.focus({ preventScroll: true });
            }, 50);
        }

        function showGameResultModal(won, guessCount, time, word) {
            const modal = document.getElementById('gameResultModal');
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const statsEl = document.getElementById('resultStats');
            const wordDisplay = document.getElementById('resultWord');
            const message = document.getElementById('resultMessage');
            const buttons = document.getElementById('resultButtons');

            modal.classList.remove('victory', 'defeat');
            title.classList.remove('victory', 'defeat');
            wordDisplay.classList.remove('defeat');

            const kind = won ? 'victory' : 'defeat';
            modal.classList.add(kind);
            title.classList.add(kind);
            icon.textContent = won ? '✦' : '◆';
            title.textContent = won ? 'VICTORY' : 'DEFEAT';
            wordDisplay.textContent = word;
            if (!won) wordDisplay.classList.add('defeat');
            message.textContent = won ? `${WIN_WORDS[guessCount - 1] || 'Phew'}! You solved it!` : 'Better luck next time!';
            buttons.innerHTML = `
                <button class="result-btn result-btn-share" onclick="shareResult()">📤 SHARE</button>
                <button class="result-btn ${won ? 'result-btn-analysis-win' : 'result-btn-analysis-lose'}" onclick="showGuessDetails()">📊 VIEW ANALYSIS</button>
                <button class="result-btn result-btn-new" onclick="resetGame()">🔄 NEW GAME</button>
            `;
            statsEl.innerHTML = `
                <div class="result-stat">
                    <div class="result-stat-value">${won ? guessCount : 'X'}/${MAX_ATTEMPTS}</div>
                    <div class="result-stat-label">GUESSES</div>
                </div>
                <div class="result-stat">
                    <div class="result-stat-value">${formatTime(time)}</div>
                    <div class="result-stat-label">TIME</div>
                </div>
            `;
            modal.classList.add('show');
            modal.setAttribute('aria-hidden', 'false');
            focusFirst(buttons);
        }

        function closeGameResultModal() {
            const modal = document.getElementById('gameResultModal');
            modal.classList.remove('show');
            modal.setAttribute('aria-hidden', 'true');
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function showGuessDetails() {
            const overlay = document.getElementById('guessDetailsOverlay');
            const detailsList = document.getElementById('guessDetailsList');
            if (!state.guesses || state.guesses.length === 0) {
                detailsList.innerHTML = '<div style="text-align:center;color:#888">No guesses found</div>';
                overlay.classList.remove('hidden');
                focusFirst(overlay);
                return;
            }
            const map = { correct: ['found', '✓ Correct'], present: ['wrong-pos', '⚠ Wrong Pos'], absent: ['not-found', '✗ Not Found'] };
            detailsList.innerHTML = state.guesses.map((guess, index) => {
                const scores = scoreGuess(guess, state.secret_word);
                return `
                    <div class="guess-entry">
                        <div class="guess-number">GUESS ${index + 1}: ${guess}</div>
                        <div class="guess-tiles">
                            ${guess.split('').map((letter, i) => `<div class="guess-tile ${scores[i]}">${letter}</div>`).join('')}
                        </div>
                        <div class="guess-analysis">
                            ${scores.map((score, i) => {
                                const [cls, lbl] = map[score];
                                return `<div class="analysis-item ${cls}">${guess[i]}<br><span class="analysis-label">${lbl}</span></div>`;
                            }).join('')}
                        </div>
                    </div>`;
            }).join('');
            overlay.classList.remove('hidden');
            focusFirst(overlay);
        }

        function closeGuessDetails() {
            document.getElementById('guessDetailsOverlay').classList.add('hidden');
        }

        function renderDistribution() {
            const el = document.getElementById('guessDist');
            const d = stats.guess_dist;
            const max = Math.max(1, ...d);
            el.innerHTML = d.map((c, i) => `
                <div class="dist-row">
                    <span class="dist-n">${i + 1}</span>
                    <div class="dist-track"><div class="dist-bar${stats.last_result === i + 1 ? ' hl' : ''}" style="width:${Math.max(7, (c / max) * 100)}%" aria-label="${i + 1} guesses: ${c} wins">${c}</div></div>
                </div>`).join('');
        }

        function showStats() {
            const overlay = document.getElementById('statsOverlay');
            overlay.classList.remove('hidden');
            document.querySelectorAll('.stats-tab').forEach((btn, idx) => btn.classList.toggle('active', idx === 0));
            document.querySelectorAll('.stats-content').forEach((c, idx) => c.classList.toggle('active', idx === 0));
            document.getElementById('stat-games').textContent = stats.games_played;
            document.getElementById('stat-winpct').textContent = (stats.games_played ? Math.round(stats.wins * 100 / stats.games_played) : 0) + '%';
            document.getElementById('stat-streak').textContent = stats.current_streak;
            document.getElementById('stat-maxstreak').textContent = stats.max_streak;
            document.getElementById('stat-avgtime').textContent = stats.win_count > 0 ? formatTime(Math.floor(stats.total_win_time / stats.win_count)) : '—';
            document.getElementById('stat-lasttime').textContent = stats.last_solve_time > 0 ? formatTime(stats.last_solve_time) : '—';
            renderDistribution();
            focusFirst(overlay);
        }

        function closeStats() { document.getElementById('statsOverlay').classList.add('hidden'); }

        function showSettings() {
            const overlay = document.getElementById('settingsOverlay');
            document.getElementById('setKeyboardOnly').checked = !!settings.keyboardOnly;
            overlay.classList.remove('hidden');
            focusFirst(overlay);
        }
        function closeSettings() { document.getElementById('settingsOverlay').classList.add('hidden'); }

        function switchStatsTab(tab, event) {
            document.querySelectorAll('.stats-tab').forEach(btn => btn.classList.remove('active'));
            if (event) event.currentTarget.classList.add('active');
            document.querySelectorAll('.stats-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            if (tab === 'history') displayGameHistory();
        }

        function displayGameHistory() {
            const history = getGameHistory();
            const historyList = document.getElementById('history-list');
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">No games played yet</div>';
                return;
            }
            historyList.innerHTML = history.map((game, index) => `
                <div class="history-item ${game.won ? 'won' : 'lost'}">
                    <div><span style="color:#888">#${index + 1}</span><span style="margin-left:8px;font-size:0.7rem;color:#666">${escapeHTML(game.date)}</span></div>
                    <div class="history-word">${escapeHTML(game.word)}</div>
                    <div>${Number(game.guesses) || 0}/${MAX_ATTEMPTS}</div>
                    <div style="text-align:right"><span class="history-status ${game.won ? 'won' : 'lost'}">${game.won ? '✦ WON' : '◆ LOST'}</span></div>
                </div>
            `).join('');
        }

        // ── Events ──────────────────────────────────────
        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeGuessDetails(); closeStats(); closeSettings(); closeGameResultModal();
                    return;
                }
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (settings.keyboardOnly) return;       // onscreen keyboard only
                if (!canType()) return;                  // let focused buttons handle Enter/Space
                if (e.key === 'Enter') { e.preventDefault(); handleKey('ENTER'); }
                else if (e.key === 'Backspace') { e.preventDefault(); handleKey('BACKSPACE'); }
                else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
            });

            document.addEventListener('click', (e) => {
                if (e.target === document.getElementById('statsOverlay')) closeStats();
                if (e.target === document.getElementById('settingsOverlay')) closeSettings();
                if (e.target === document.getElementById('guessDetailsOverlay')) closeGuessDetails();
            });

            document.getElementById('setKeyboardOnly').addEventListener('change', (e) => {
                settings.keyboardOnly = e.target.checked;
                saveSettings();
            });

            // auto-pause when the tab is hidden so the timer stays fair
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && timerStarted && !state.game_over) pauseGameTimer();
            });
        }
    </script>
</body>
</html>
